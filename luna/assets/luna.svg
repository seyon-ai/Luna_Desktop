<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb8ff"/>
      <stop offset="1" stop-color="#5a76a8"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe0ff"/>
      <stop offset="0.55" stop-color="#8fb8ff"/>
      <stop offset="1" stop-color="#6e8fd0"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="512" height="512" fill="#000"/>
      <circle cx="256" cy="256" r="150" fill="#fff"/>
      <circle cx="312" cy="206" r="135" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="#0b0f17"/>
  <!-- orbital ring -->
  <ellipse cx="256" cy="256" rx="190" ry="150" fill="none" stroke="url(#ring)" stroke-width="11"/>
  <!-- ring nodes -->
  <circle cx="420" cy="181" r="13" fill="#d3aef2"/>
  <circle cx="112" cy="331" r="13" fill="#d3aef2"/>
  <circle cx="256" cy="406" r="13" fill="#d3aef2"/>
  <!-- crescent -->
  <circle cx="256" cy="256" r="150" fill="url(#moon)" mask="url(#crescent)"/>
  <path d="M 300 130 A 150 150 0 0 0 190 386 A 132 132 0 0 1 300 130 Z"
        fill="#eaf1ff" opacity="0.55"/>
  <!-- spark -->
  <g stroke="#f0f5ff" stroke-width="6" stroke-linecap="round">
    <line x1="408" y1="96" x2="408" y2="156"/>
    <line x1="378" y1="126" x2="438" y2="126"/>
  </g>
</svg>

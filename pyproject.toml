[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luna-desktop"
version = "0.1.0"
description = "LUNA — a local-first AI desktop personal assistant and general-purpose computer-use agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LUNA Contributors" }]
keywords = ["assistant", "agent", "desktop", "automation", "kokoro", "local-ai"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]

dependencies = [
    # Core runtime has no hard dependencies on AI runtimes. Optional components
    # are installed through extras so LUNA can run with or without them.
]

[project.optional-dependencies]
ui = ["PySide6>=6.6,<7"]
ai = ["httpx>=0.27", "numpy>=1.26"]
browser = ["playwright>=1.44"]
tts = [
    "kokoro-onnx>=0.4",
    "misaki[en]>=0.7",
    "onnxruntime>=1.18",
    "numpy>=1.26",
]
stt = ["faster-whisper>=1.0"]
kws = ["openwakeword>=0.7"]
desktop = [
    "pyautogui>=0.9.54",
    "pyperclip>=1.8",
    "pillow>=10.0",
    "uiautomation>=2.0.20",
    "pywin32>=306",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "pillow>=10.0",
    "pyinstaller>=6.6",
]
all = [
    "PySide6>=6.6,<7",
    "httpx>=0.27",
    "numpy>=1.26",
    "playwright>=1.44",
    "kokoro-onnx>=0.4",
    "misaki[en]>=0.7",
    "onnxruntime>=1.18",
    "faster-whisper>=1.0",
    "openwakeword>=0.7",
    "pyautogui>=0.9.54",
    "pyperclip>=1.8",
    "pillow>=10.0",
    "uiautomation>=2.0.20",
    "pywin32>=306",
]

[project.scripts]
luna = "luna.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["luna*"]

[tool.setuptools.package-data]
"luna" = ["assets/*.svg", "assets/*.png", "assets/*.ico", "assets/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

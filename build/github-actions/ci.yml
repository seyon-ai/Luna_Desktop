name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    name: Tests (Linux, no GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest
      - name: Run tests
        run: pytest tests -q
      - name: Smoke init
        run: LUNA_HOME="$RUNNER_TEMP/luna" python -m luna --home "$RUNNER_TEMP/luna" --smoke-test

  test-windows:
    name: Tests + Build Windows .exe
    runs-on: windows-latest
    needs: test-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 playwright numpy onnxruntime kokoro-onnx "misaki[en]" pyautogui pyperclip pillow httpx pytest pyinstaller uiautomation pywin32
      - name: Install Chromium for Playwright
        run: python -m playwright install chromium
      - name: Run tests (including GUI smoke)
        env:
          LUNA_FORCE_UI_TESTS: "1"
        run: pytest tests -q
      - name: Build LUNA (PyInstaller)
        run: python scripts/build_windows.py --skip-install
      - name: Smoke-test packaged EXE services
        shell: pwsh
        run: |
          $env:LUNA_HOME = "$env:RUNNER_TEMP\luna"
          & "dist\LUNA\LUNA.exe" --smoke-test
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: LUNA-windows-portable
          path: |
            dist/LUNA/
            dist/LUNA/LUNA.exe
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LUNA-windows-portable
          path: dist/LUNA
      - name: Zip portable build
        shell: bash
        run: |
          cd dist
          7z a -tzip LUNA-windows-portable.zip LUNA/ || zip -r LUNA-windows-portable.zip LUNA/
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LUNA-windows-portable.zip
          generate_release_notes: true
